name: Lint

on:
  pull_request:
    branches: [main, modelo]

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4
      - name: Instalar uv
        uses: astral-sh/setup-uv@v3
      - name: Comprobar el formato con Ruff
        run: uv run ruff check .
      - name: Comprobar los tipos con MyPy si hay archivos Python
        run: |
          if [ -n "$(git ls-files '*.py')" ]; then uv run mypy .; fi
